name: Verificar aplicación
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Local compilation/packaging only: no Netlify login, upload or deploy.
      - run: npm run netlify:prepare
